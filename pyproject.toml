[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-translator"
version = "1.0.0"
description = "Translate PDF documents (Chinese -> English and more) while keeping the original layout"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pymupdf-fonts>=1.0.5",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "anthropic>=1.0",
]

[project.optional-dependencies]
ocr = ["rapidocr_onnxruntime>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
pdf-translate = "pdf_translator.cli:main"
pdf-translate-web = "pdf_translator.web:main"
pdf-translate-shortcut = "pdf_translator.shortcut:main"

[tool.setuptools.packages.find]
include = ["pdf_translator*"]

[tool.setuptools.package-data]
pdf_translator = ["static/*"]
